let currentCardIdx = 0;
let globalSide = "front";
let nightOverride = "auto";
let focusIdx = null;
const userPicks = {};
const cardSides = {};

function renderMustache(tmpl, fields) {
  let out = tmpl;
  out = out.replace(/\{\{#([A-Za-z0-9_]+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (_, key, inner) => {
    const val = fields[key];
    return val && val.trim().length > 0 ? inner : "";
  });
  out = out.replace(/\{\{([A-Za-z0-9_]+)\}\}/g, (_, key) => {
    return fields[key] !== undefined ? fields[key] : "";
  });
  return out;
}

function mountCardShadow(hostEl, th, card, sideNow) {
  const sr = hostEl.shadowRoot || hostEl.attachShadow({ mode: "open" });
  const useDark = nightOverride === "auto" ? th.defaultDark : (nightOverride === "dark");
  const tmpl = sideNow === "front" ? th.qfmt : th.afmt;
  const htmlBody = renderMustache(tmpl, card.fields);
  const pickKey = th.key + ":" + card.id;
  const picked = userPicks[pickKey] || null;

  sr.innerHTML = `<style>:host{display:block;}${th.css}</style><div class="${useDark ? 'card nightMode' : 'card'}">${htmlBody}</div>`;

  sr.querySelectorAll(".opt").forEach((optEl) => {
    const letter = optEl.querySelector(".opt-letter").textContent.replace(/[()\s]/g, "");
    if (sideNow === "front" && picked === letter) {
      optEl.classList.add("user-picked");
    }
    if (sideNow === "back" && picked && picked === letter && !optEl.classList.contains("correct")) {
      optEl.classList.add("user-wrong");
    }
    if (sideNow === "front") {
      optEl.addEventListener("click", () => {
        userPicks[pickKey] = letter;
        mountCardShadow(hostEl, th, card, "front");
      });
    }
  });
}

function renderAll() {
  document.getElementById("btnAllFront").classList.toggle("active", globalSide === "front");
  document.getElementById("btnAllBack").classList.toggle("active", globalSide === "back");
  const nb = document.getElementById("btnNight");
  nb.textContent = nightOverride === "auto" ? "🌗 Theme Default" : (nightOverride === "dark" ? "🌙 Forced Night" : "☀️ Forced Light");
  nb.classList.toggle("active", nightOverride !== "auto");
  const vb = document.getElementById("btnViewMode");
  vb.textContent = focusIdx === null ? "⊞ Showing All 10" : "← Back to All 10 Grid";

  const strip = document.getElementById("themeStrip");
  strip.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "pill-tab" + (focusIdx === null ? " selected" : "");
  allBtn.textContent = "All 10 Systems";
  allBtn.onclick = () => { focusIdx = null; renderAll(); };
  strip.appendChild(allBtn);

  THEMES.forEach((th, idx) => {
    const b = document.createElement("button");
    b.className = "pill-tab" + (focusIdx === idx ? " selected" : "");
    b.innerHTML = `<span class="dot" style="background:${th.accent}"></span>#${th.num} ${th.name}`;
    b.onclick = () => { focusIdx = idx; renderAll(); };
    strip.appendChild(b);
  });

  const stage = document.getElementById("stageContainer");
  stage.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "gallery-grid";
  if (focusIdx !== null) {
    grid.style.gridTemplateColumns = "minmax(0, 920px)";
    grid.style.justifyContent = "center";
  }

  const card = CARDS[currentCardIdx];
  const list = focusIdx === null ? THEMES.map((t, i) => [t, i]) : [[THEMES[focusIdx], focusIdx]];

  list.forEach(([th, idx]) => {
    const shell = document.createElement("div");
    shell.className = "theme-card-shell";
    const sKey = th.key + ":" + card.id;
    const effSide = cardSides[sKey] || globalSide;

    shell.innerHTML = `
      <div class="shell-bar">
        <div class="shell-title">
          <span class="num-chip" style="background:${th.accent}">#${th.num}</span>
          <div>
            <div class="shell-name">${th.name}</div>
            <div class="shell-tag">${th.tagline}</div>
          </div>
        </div>
        <div class="shell-actions">
          <button class="mini-btn ${effSide === 'back' ? 'flipped' : ''}" data-flip="1">${effSide === 'front' ? 'Flip → Back' : '← Back to Front'}</button>
          <a class="mini-btn" style="text-decoration:none;background:#facc15;color:#111;border-color:#111;font-weight:800;" href="${th.fullApkg || th.updaterApkg}" download>⬇ ${th.fullApkg ? "Full Deck (.apkg)" : "Theme Updater (.apkg)"}</a><button class="mini-btn" data-zoom="1">${focusIdx === idx ? 'Grid View' : 'Zoom'}</button>
        </div>
      </div>
      <div class="shadow-mount"></div>`;

    const mount = shell.querySelector(".shadow-mount");
    mountCardShadow(mount, th, card, effSide);

    shell.querySelector("[data-flip]").onclick = () => {
      cardSides[sKey] = (cardSides[sKey] || globalSide) === "front" ? "back" : "front";
      renderAll();
    };
    shell.querySelector("[data-zoom]").onclick = () => {
      focusIdx = focusIdx === idx ? null : idx;
      renderAll();
    };
    grid.appendChild(shell);
  });

  stage.appendChild(grid);
}

const sel = document.getElementById("sampleSelect");
CARDS.forEach((c, idx) => {
  const opt = document.createElement("option");
  opt.value = idx;
  opt.textContent = c.label;
  sel.appendChild(opt);
});
sel.onchange = (e) => { currentCardIdx = parseInt(e.target.value, 10); renderAll(); };
document.getElementById("btnAllFront").onclick = () => { globalSide = "front"; Object.keys(cardSides).forEach(k => delete cardSides[k]); renderAll(); };
document.getElementById("btnAllBack").onclick = () => { globalSide = "back"; Object.keys(cardSides).forEach(k => delete cardSides[k]); renderAll(); };
document.getElementById("btnNight").onclick = () => {
  nightOverride = nightOverride === "auto" ? "dark" : (nightOverride === "dark" ? "light" : "auto");
  renderAll();
};
document.getElementById("btnViewMode").onclick = () => { focusIdx = focusIdx === null ? 0 : null; renderAll(); };

renderAll();
</script>
