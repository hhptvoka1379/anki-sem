n(function() {\n  document.documentElement.removeAttribute('data-sf-theme');\n  var itemId = \"{{ItemID}}\";\n  try {\n    var picked = sessionStorage.getItem(\"pick_\" + itemId);\n    if (picked) {\n      document.querySelectorAll('.opt').forEach(function(o) {\n        var l = o.querySelector('.opt-letter');\n        var txt = l ? l.textContent.replace(/[()\\s]/g, '') : '';\n        if (txt === picked && !o.classList.contains('correct')) {\n          o.classList.add('user-wrong');\n        }\n      });\n    }\n  } catch(e) {}\n})();\n<\/script>\n<script>\n(function() {\n  var canvas = document.querySelector('.sf-canvas');\n  var btn = document.getElementById('sf-theme-toggle');\n  if (!canvas || !btn) return;\n  function apply(dark) {\n    canvas.classList.toggle('sf-dark', dark);\n    btn.textContent = dark ? 'LIGHT' : 'DARK';\n    btn.style.background = dark ? '#18181b' : '#fef08a';\n    btn.style.color = dark ? '#fafafa' : '#111';\n    btn.style.borderColor = dark ? '#fafafa' : '#111';\n  }\n  var dark = false;\n  try { dark = localStorage.getItem('sf-theme') === 'dark'; } catch (e) {}\n  apply(dark);\n  btn.addEventListener('click', function() {\n    dark = !dark;\n    apply(dark);\n    try { localStorage.setItem('sf-theme', dark ? 'dark' : 'light'); } catch (e) {}\n  });\n})();\n<\/script>"}, "cards": [{"ItemID": "CHIM-C01-COMM-002", "Subject": "Chimica e Propedeutica Biochimica", "SubjectCode": "CHIM", "ChapterNum": "1", "ChapterTitle": "La matematica e la chimica", "QuizTypeLabel": "Quiz commentati", "QuestionNum": "2", "BookPage": "3", "FrontStemHTML": "Quale/i fra le seguenti affermazioni è/sono vera/e?\n<span class=\"stmt-line\">• A₁: l'idrogeno è l'unico elemento a cui si attribuiscono nomi differenti per alcuni suoi isotopi;</span>\n<span class=\"stmt-line\">• A₂: in chilogrammi, l'ordine di grandezza della massa di un atomo è compreso fra 10⁻³¹ e 10⁻²⁹;</span>\n<span class=\"stmt-line\">• A₃: ad eccezione dell'idrogeno tutti gli atomi degli altri elementi chimici hanno in egual numero elettroni e neutroni.</span>", "BackStemHTML": "Quale/i fra le seguenti affermazioni è/sono vera/e?\n<span class=\"stmt-line\">• A₁: l'idrogeno è l'unico elemento a cui si attribuiscono nomi differenti per alcuni suoi isotopi;</span>\n<span class=\"stmt-line\">• A₂: in chilogrammi, l'ordine di grandezza della massa di un atomo è compreso fra 10⁻³¹ e 10⁻²⁹;</span>\n<span class=\"stmt-line\">• A₃: ad eccezione dell'idrogeno tutti gli atomi degli altri elementi chimici hanno in egual numero elettroni e neutroni.</span>", "FrontOptionsHTML": "<div class=\"options\">\n<div class=\"opt\"><span class=\"opt-letter\">A</span><span class=\"opt-body\">A₂ e A₃</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">B</span><span class=\"opt-body\">A₁ e A₂</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">C</span><span class=\"opt-body\">Tutte</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">D</span><span class=\"opt-body\">A₁ e A₃</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">E</span><span class=\"opt-body\">Nessuna</span></div>\n</div>", "BackOptionsHTML": "<div class=\"options\">\n<div class=\"opt\"><span class=\"opt-letter\">A</span><span class=\"opt-body\">A₂ e A₃</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">B</span><span class=\"opt-body\">A₁ e A₂</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">C</span><span class=\"opt-body\">Tutte</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">D</span><span class=\"opt-body\">A₁ e A₃</span></div>\n<div class=\"opt correct\"><span class=\"opt-letter\">E</span><span class=\"opt-body\">Nessuna</span></div>\n</div>", "AnswerBannerHTML": "Risposta corretta: E. Nessuna", "ExplanationHTML": "Le affermazioni sono tutte false:\n<span class=\"stmt-line\">• L'affermazione A₁ è falsa in quanto, oltre agli isotopi dell'idrogeno, cui sono assegnati i nomi prozio, deuterio e trizio, anche ad alcuni isotopi del radon sono assegnati nomi diversi da quello dell'elemento (il Rn-220 è detto thoron e il Rn-219 actinon).</span>\n<span class=\"stmt-line\">• L'affermazione A₂ è falsa in quanto le masse atomiche degli elementi sono comprese tra ordini di grandezza di 10⁻²⁷ e 10⁻²⁵ kg.</span>\n<span class=\"stmt-line\">• L'affermazione A₃ è falsa in quanto tutti gli elementi presentano isotopi, ovvero atomi di uno stesso elemento che hanno uguale numero atomico (numero di protoni) ma diverso numero di massa (protoni + neutroni), poiché differiscono per il numero di neutroni contenuti nel nucleo.</span>", "FigureHTML": "", "QuestionScanHTML": "<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABFQAAANxAgMAAAC3VQXIAAAADFBMVEUAAABVVVWqqqr////Bf2LRAAA72klEQVR42u192arkOrbtcCrgcsGFDfUB9xdU7PO4Egvqi88HHFCQ63EXqR85YJN6tNB9UGNJliMca9nRWaYq94oIudHw7DQ1m0qjHLPjR4GgoFJQKagUVAoqBZWCSkGloFJQKagUVMqxJSpDG35gya+qaqNfB/NXVUWjqtMX7pvc5Vyxa6dU6cOxPVCpqhMggsc7t+dkiAw/tAKiTWcEQH3l5uHL+IQEg7hyhkKCwqfYAZXKot2G2M/eeoSLfa4WyQPejks4RcWghjUnJSgwuT0qanYfuXJ+ahNKFdF92+snyLvJFQk63U1M1JCDQG1105mAeCJpK9FwAPU0W4YGF7mbujMJ59+iUjZdzFNNT6+cVt+JVigAEtJCP58siT5x8+h19733kV6260Gaa0ATJLjxBKfTBpDU/iaM+4elM+5V0WQ6vhW56++f0vV70ApP5R65j7UlEjZlK7jjXnKF6BgbAHX0dEPFDFLelOPGUhFGW1VuiBWhrbXIKmfXqdAws0OHKjJ47KWFhJoukYjmNpQ/g/2YHao3OXoQrTka84mj0SOgAc3RaQ4QPYJobe/HoUc0WmsAHQA0vfllBLTmQKfNj43uYa5lnpWj0yNAdA8AjTandlrrHoAeAfT2+8wj2hHo7GWgtXmpo3twd+yJigGm0TDPQ/QIM2EO3TtUovcz2icl5m9zrsXAINhoDsB8Q0YAxNyVB9KBmFMzqJgRjYUbnYG7G0HisTuvDtlMygondmRubDBcujEqFh4sYwqZb8RVK03EVqfw49UumlksSTkeTlnYJ2aXTFRnFwsA9XBxdiSxPezftbimmCHBAEiyYL9sRis0sKbsrP/tjbxUP9cTZmOqtCa72NkdjLlz+NwupoHWI0ZCUYaPHBjcEhE1l6HuWmIvK45dsNlqb9IFT+twaYj5+yNQYI275AcV1kjugD/+yj1k7VBtrDWI2syZ1gDPWwY1hZHG9pS/HVbz0dugoiK1nANIBACq5EX/pWenC/vEzGpfPl/ZjfEZ1szny7YSBVA7npEgBAC3WO3EQRcehYyWlBTwGZO9+0v/BnPzZZG8xVyyKBHckXprNeKD/8yfpOHC0CiJSJzutw6SliNkVtKmskAmRMEBqgKZJ+3Zqs0L2pDaRJ6J5QKbk16ssX63QUWAXtKFp4sun4X1GA3nxrKUyeY+hQvOyfN9LX6AXRIryeNwZITQOatZlJe+V2c0XPVlWd8sM9cWuCQKN0FFpV6CRQX1sSCAWCwBwA1DMYBwo8KC88aM4k3or1lywIV6 opt\"><span class=\"opt-letter\">C</span><span class=\"opt-body\">V<sub>M</sub> = (40/50) · 10 V</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">D</span><span class=\"opt-body\">la potenza complessiva è 100/30 W</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">E</span><span class=\"opt-body\">la corrente complessiva è 10/40 A</span></div>\n</div>", "AnswerBannerHTML": "Risposta corretta: A. V<sub>M</sub> = 5 V", "ExplanationHTML": "Le resistenze R₂ e R₃ in parallelo equivalgono a R<sub>23</sub> = (20 × 20)/(20 + 20) = 10 Ω. La resistenza totale vale R<sub>tot</sub> = R₁ + R<sub>23</sub> = 20 Ω e la potenza dissipata vale P = ΔV²/R<sub>tot</sub> = 100 / 20 = 5 W. Poiché R₁ = R<sub>23</sub> = 10 Ω, la tensione tra A (10 V) e B (0 V) si ripartisce equamente, per cui nel nodo intermedio M si ha V<sub>M</sub> = 5 V.", "FigureHTML": "<img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXwAAABsCAIAAADmJJ6yAAAF30lEQVR4nO3d3ZKkKBCGYd3Y+79l96BmXAIBIYE0Sd7naKJ6aC1aPlPx57yu6wAALf98vQIA9kLoAFBF6ABQRegAUEXoAFD179crsLbzPKNPmA1s8uzAgz70jkpnjOu6fkMlOYqQc+fL3YEHfegdoTMSudMq6itqnB0QOgOwiwbqETrjsbtuRWpv5WSEiHEStB99uCFmr0ZitDRh7m9PHF71CqddIEAH7obQgSGc09kBoSOUHB7PDxlFlZLFzhnQXyVMQuh0Ca9te/6UoVKQ65z7898/OPLyh9CRiAZG8kcHAyavZtLqPtdDNzrD7JVEchgwNurl+oo+3AGVDqzjKNUZKp3tvB4AGjxCNLIaGIJKZzv1A9jCUD9PLpr3htDZmvE5fhLHJQ6vJvoNYEaOzN179yd0ow+EzkTLDRJTZc5yvYdKHF7tjsdoQRmhs6nnbZamyhw4RuiAuIEqQucP/YFnYahHj+wbdWwlvkVT3CcWOhOVCJ3j6NvWlUeXfZ3BIWgubohPEDr/09/NfjhO7kWXb5Qfsojh/znXkNxZgsXQUX5+inir1W9o35Cv46xPELEYOj/Gt7wVq5tQWNcMf2Bo69sdnmXX7Ib4kN3Q0dG/1coafvtCy3LEXH+1/trk1cP136716TnR344rjFZhLnQ+2VNFW+3rOog399yVeJ72z62D//URgq2L89SZLlm8DeK6rpq7lvpneTu3zuTm/rrCyYbfGjJfnnyfzOvfMdknTQ2bligOMgxk617EcOsvj4Qh9wEmF/EaDbn/UNmwsGd28KDl3Ldr7cxyw5oe66yATI0LZyxWOqGaW7THDsvy3lJcrRRW8l5iU6u1iDtTfI8+N/ebZegPkxtgU/f/rTvSyqpkSPVUPgE05A83PK/LS0l+u9YD0s6G5X4zewjsia1KJzlWX3dZw7ePXLHzukUWahbZEpOLG/h9oxWeNNLE3VL+nU1LdFMzOmBu9qrSFZj0+6NPmvaBycv/ZKs6e5c774rkp7srKvvkObvXmh3RHRLULxZYCZ3cZEThpzpyxzg5uXVubehs i valore R, che sono percorse rispettivamente da due correnti I₂ e I₃. Quale delle seguenti affermazioni è ERRATA?", "FrontOptionsHTML": "<div class=\"options\">\n<div class=\"opt\"><span class=\"opt-letter\">A</span><span class=\"opt-body\">I₁ = I₂ = I₃</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">B</span><span class=\"opt-body\">La resistenza equivalente tra CD è uguale a (1/2) R</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">C</span><span class=\"opt-body\">La potenza dissipata tra i morsetti AB è metà di quella dissipata tra i morsetti CD</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">D</span><span class=\"opt-body\">La corrente totale tra i morsetti CD è doppia di I₁</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">E</span><span class=\"opt-body\">I₁ = I₂ + I₃</span></div>\n</div>", "BackOptionsHTML": "<div class=\"options\">\n<div class=\"opt\"><span class=\"opt-letter\">A</span><span class=\"opt-body\">I₁ = I₂ = I₃</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">B</span><span class=\"opt-body\">La resistenza equivalente tra CD è uguale a (1/2) R</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">C</span><span class=\"opt-body\">La potenza dissipata tra i morsetti AB è metà di quella dissipata tra i morsetti CD</span></div>\n<div class=\"opt\"><span class=\"opt-letter\">D</span><span class=\"opt-body\">La corrente totale tra i morsetti CD è doppia di I₁</span></div>\n<div class=\"opt correct\"><span class=\"opt-letter\">E</span><span class=\"opt-body\">I₁ = I₂ + I₃</span></div>\n</div>", "AnswerBannerHTML": "Risposta corretta: E. I₁ = I₂ + I₃", "ExplanationHTML": "La resistenza equivalente tra C e D vale R<sub>CD</sub> = R/2 (opzione B vera). Essendo V<sub>CD</sub> = V<sub>AB</sub>, ciascun ramo in parallelo porta corrente I₂ = I₃ = V<sub>AB</sub>/R = I₁ (opzione A vera), per cui la corrente totale tra C e D è I<sub>CD</sub> = I₂ + I₃ = 2I₁ (opzione D vera) e la potenza dissipata tra A e let curDeck = 'riso';
let curSide = 'front';
let cardIdx = 0;
let night = true;

function renderTemplate(tpl, fields) {
  let out = tpl.replace(/\{\{#(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (_, k, inner) => fields[k] ? inner : '');
  out = out.replace(/\{\{(\w+)\}\}/g, (_, k) => (fields[k] !== undefined ? fields[k] : ''));
  return out;
}

function refresh() {
  const d = DATA[curDeck];
  const c = DATA.cards[cardIdx];
  const bodyHtml = renderTemplate(curSide === 'front' ? d.qfmt : d.afmt, c);
  const frame = document.getElementById('card-frame');
  const cls = night ? 'card card1 isMac nightMode night_mode' : 'card card1 isMac';
  frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>' + d.css + '</style></head><body class="' + cls + '"><div id="qa">' + bodyHtml + '</div></body></html>';
  document.getElementById('status-bar').textContent =
    (curDeck === 'master'
      ? 'Deck attivo: output/Semestre_Filtro_Complete.apkg — clicca il numerino in alto a destra (00..10) per cambiare tema in tempo reale!'
      : 'Deck attivo: output/themes/Semestre_Filtro_04_NeoBrutalist_Risoprint_Zine.apkg — standalone v5 con toggle DARK/LIGHT e accordions impilati!') +
    '  •  Carta (' + (cardIdx + 1) + '/' + DATA.cards.length + '): ' + c.ItemID;
}

function setDeck(k) {
  curDeck = k;
  document.getElementById('deck-master').classList.toggle('active', k === 'master');
  document.getElementById('deck-riso').classList.toggle('active', k === 'riso');
  refresh();
}
function setSide(s) {
  curSide = s;
  document.getElementById('side-front').classList.toggle('active', s === 'front');
  document.getElementById('side-back').classList.toggle('active', s === 'back');
  refresh();
}
function nextCard() {
  cardIdx = (cardIdx + 1) % DATA.cards.length;
  document.getElementById('next-card-btn').textContent = 'Prossima Carta (' + (cardIdx + 1) + '/' + DATA.cards.length + ')';
  refresh();
}
function toggleNight() {
  night = !night;
  const b = document.getElementById('anki-dark');
  b.classList.toggle('active', night);
  b.textContent = night ? 'Anki Host Chrome: Dark Mode ON' : 'Anki Host Chrome: Light Mode';
  refresh();
}
refresh();
</script>
