\n  }\n\n  function bindCardInteractions() {\n    var opts = canvas.querySelectorAll('.opt');\n    var picked = null;\n    try { picked = sessionStorage.getItem('pick_' + itemId); } catch(e) {}\n    opts.forEach(function(el, idx) {\n      var lEl = el.querySelector('.opt-letter');\n      var letter = lEl ? lEl.textContent.replace(/[().✓\\s]/g, '') : String.fromCharCode(65 + idx);\n      if (side === 'front') {\n        if (picked === letter) el.classList.add('user-picked');\n        el.addEventListener('click', function() {\n          picked = letter;\n          try { sessionStorage.setItem('pick_' + itemId, letter); } catch(e) {}\n          opts.forEach(function(o) { o.classList.remove('user-picked'); });\n          el.classList.add('user-picked');\n        });\n      } else if (picked && letter === picked && !el.classList.contains('correct')) {\n        el.classList.add('user-wrong');\n      }\n    });\n  }\n\n  var cur = readTheme();\n\n  function syncCanvasSurface() {\n    var d = DEFAULT_DARK[cur];\n    var useDark = (d === 'auto')\n      ? !!(document.body && (document.body.classList.contains('nightMode') || document.body.classList.contains('night_mode')))\n      : !!d;\n    canvas.className = useDark ? 'sf-canvas sf-dark' : 'sf-canvas';\n  }\n\n  function applyTheme(n, showToast) {\n    if (!LABELS[n]) n = '00';\n    cur = n;\n    saveTheme(n);\n    document.documentElement.setAttribute('data-sf-theme', n);\n    syncCanvasSurface();\n    var tpl = document.getElementById('sf-t' + n);\n    if (tpl && canvas) {\n      canvas.innerHTML = '';\n      canvas.appendChild(tpl.content.cloneNode(true));\n      bindCardInteractions();\n    }\n    var ui = document.getElementById('sf-theme-ui');\n    if (ui) {\n      var tog = ui.querySelector('.is-current-toggle');\n      if (tog) tog.textContent = n;\n      ui.querySelectorAll('.sf-choice').forEach(function(b) {\n        b.classList.toggle('is-active', b.getAttribute('data-num') === n);\n      });\n      var toast = ui.querySelector('.sf-theme-toast');\n      if (toast) toast.textContent = LABELS[n];\n      if (showToast) {\n        ui.classList.add('show-label');\n        clearTimeout(ui._toastTimer);\n        ui._toastTimer = setTimeout(function() {\n          if (!ui.querySelector('.sf-theme-bar').classList.contains('is-open')) {\n            ui.classList.remove('show-label');\n          }\n        }, 1400);\n      }\n    }\n  }\n\n  var ui = document.getElementById('sf-theme-ui');\n  if (ui) {\n    var bar = ui.querySelector('.sf-theme-bar');\n    var tog = ui.querySelector('.is-current-toggle');\n    tog.addEventListener('click', function(ev) {\n      ev.stopPropagation();\n      bar.classList.add('is-open');\n      ui.classList.add('show-label');\n    });\n    tog.addEventListener('contextmenu', function(ev) {\n      ev.preventDefault();\n      var nextIdx = (NUMS.indexOf(cur) + 1) % NUMS.length;\n      applyTheme(NUMS[nextIdx], true);\n    });\n    ui.querySelectorAll('.sf-choice').forEach(function(btn) {\n      btn.addEventListener('click', function(ev) {\n        ev.stopPropagation();\n        applyTheme(btn.getAttribute('data-num'), true);\n      });\n    });\n    document.addEventListener('click', function(ev) {\n      if (bar.classList.contains('is-open') && !ui.contains(ev.target)) {\n        bar.classList.remove('is-open');\n        ui.classList.remove('show-label');\n      }\n    });\n  }\n\n  if (window.MutationObserver && document.body) {\n    new MutationObserver(syncCanvasSurface).observe(document.body, { attributes: true, attributeFilter: ['class'] });\n  }\n  if (side === 'front' && window._sfLastItem !== itemId) {\n    window._sfLastItem = itemId;\n    try { sessionStorage.removeItem('pick_' + itemId); } catch(e) {}\n  }\n  applyTheme(cur, false);\n})();<\/script>"}, "riso": {"name": "Semestre Filtro [04 Neo-Brutalist Risoprint Zine]", "css": "@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,500;0,700; let curDeck = 'riso';
let curSide = 'front';
let cardIdx = 0;
let night = true;

function renderTemplate(tpl, fields) {
  let out = tpl.replace(/\{\{#(\w+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (_, k, inner) => fields[k] ? inner : '');
  out = out.replace(/\{\{(\w+)\}\}/g, (_, k) => (fields[k] !== undefined ? fields[k] : ''));
  return out;
}

function refresh() {
  const d = DATA[curDeck];
  const c = DATA.cards[cardIdx];
  const bodyHtml = renderTemplate(curSide === 'front' ? d.qfmt : d.afmt, c);
  const frame = document.getElementById('card-frame');
  const cls = night ? 'card card1 isMac nightMode night_mode' : 'card card1 isMac';
  frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>' + d.css + '</style></head><body class="' + cls + '"><div id="qa">' + bodyHtml + '</div></body></html>';
  document.getElementById('status-bar').textContent =
    (curDeck === 'master'
      ? 'Deck attivo: output/Semestre_Filtro_Complete.apkg — clicca il numerino in alto a destra (00..10) per cambiare tema in tempo reale!'
      : 'Deck attivo: output/themes/Semestre_Filtro_04_NeoBrutalist_Risoprint_Zine.apkg — identico al 100% a theme_showcase.html anche con Anki in Dark Mode e SENZA switcher!') +
    '  •  Carta: ' + c.ItemID;
}

function setDeck(k) {
  curDeck = k;
  document.getElementById('deck-master').classList.toggle('active', k === 'master');
  document.getElementById('deck-riso').classList.toggle('active', k === 'riso');
  refresh();
}
function setSide(s) {
  curSide = s;
  document.getElementById('side-front').classList.toggle('active', s === 'front');
  document.getElementById('side-back').classList.toggle('active', s === 'back');
  refresh();
}
function nextCard() {
  cardIdx = (cardIdx + 1) % DATA.cards.length;
  event.target.textContent = 'Prossima Carta (' + (cardIdx + 1) + '/' + DATA.cards.length + ')';
  refresh();
}
function toggleNight() {
  night = !night;
  const b = document.getElementById('anki-dark');
  b.classList.toggle('active', night);
  b.textContent = night ? 'Anki Host Chrome: Dark Mode ON' : 'Anki Host Chrome: Light Mode';
  refresh();
}
refresh();
</script>
