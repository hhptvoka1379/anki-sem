      flex-direction: column;
      overflow: hidden;
    }

      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
    }

    button.active { background: #facc15; color: #111111; border-color: #facc15; }

      padding: 6px 14px;
      font-size: 11.5px;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;

    let curDeck = "master";
    let cardIdx = 0;
    let side = "front";
    let night = false;

    function renderMustache(tmpl, fields) {
      let out = tmpl.replace(/\{\{#([A-Za-z0-9_]+)\}\}([\s\S]*?)\{\{\/\1\}\}/g, (_, k, inner) => {
        return (fields[k] && String(fields[k]).trim() !== "") ? inner : "";
      });
      out = out.replace(/\{\{([A-Za-z0-9_]+)\}\}/g, (_, k) => (fields[k] !== undefined ? fields[k] : ""));
      return out;
    }

    function refresh() {
      const bundle = DATA[curDeck];
      const fields = bundle.cards[cardIdx];
      const rawBody = renderMustache(side === "front" ? bundle.qfmt : bundle.afmt, fields);
      const cls = night ? "card nightMode" : "card";
      const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' + bundle.css + '</style></head><body class="' + cls + '"><div id="qa">' + rawBody + '</div></body></html>';
      document.getElementById("ankiFrame").srcdoc = html;
      document.getElementById("btnMaster").classList.toggle("active", curDeck === "master");
      document.getElementById("btnRiso").classList.toggle("active", curDeck === "riso");

      document.getElementById("btnNight").textContent = "Anki Night Mode: " + (night ? "ON" : "OFF");
      document.getElementById("cardInfo").textContent = fields.ItemID + " (" + side.toUpperCase() + " • " + (cardIdx + 1) + "/" + bundle.cards.length + ")";
      document.getElementById("deckInfo").innerHTML = curDeck === "master"
        ? "<strong>Semestre_Filtro_Complete.apkg</strong>: clicca il piccolo numero in alto a destra sulla carta (<strong>00</strong>&ndash;<strong>10</strong>, o clic destro) per cambiare tutti i temi!"

    }

    document.getElementById("btnMaster").onclick = () => { curDeck = "master"; refresh(); };

    document.getElementById("btnFlip").onclick = () => { side = side === "front" ? "back" : "front"; refresh(); };
    document.getElementById("btnPrev").onclick = () => { cardIdx = (cardIdx + 3) % 4; side = "front"; refresh(); };
    document.getElementById("btnNext").onclick = () => { cardIdx = (cardIdx + 1) % 4; side = "front"; refresh(); };
    document.getElementById("btnNight").onclick = () => { night = !night; refresh(); };

    refresh();
  </script>
</body>
</html>
